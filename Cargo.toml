[package]
name = "fe2o3-starmap"
version = "0.1.2"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "The naked-eye sky in braille: 9,096 stars with distances, constellation figures, planisphere and hemisphere projections, and an interactive star picker."
license = "Unlicense"
repository = "https://github.com/isene/starmap"
readme = "README.md"
keywords = ["astronomy", "terminal", "tui", "stars", "braille"]
categories = ["command-line-interface", "science"]
exclude = ["img/*"]

[lib]
name = "starmap"

[dependencies]
crust = { version = "0.1.46", path = "../crust", package = "fe2o3-crust" }
glow = { version = "0.1.30", path = "../glow", package = "fe2o3-glow" }

[profile.release]
opt-level = 3
lto = true
